services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../../
      dockerfile: juxing-engine/backend/Dockerfile
    env_file:
      - ../backend/.env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=positions
      - EMBEDDING_MODEL_NAME=shibing624/text2vec-base-chinese
    volumes:
      - ./data:/data
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      - redis
      - qdrant

  admin-web:
    build:
      context: ../../
      dockerfile: juxing-engine/admin-web/Dockerfile
    environment:
      - NEXT_PUBLIC_API_BASE_URL=/api/v1
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - admin-web
